<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | AREOX Airfare Intelligence</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(14, 165, 233, 0.3);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .icon-box {
      width: 76px;
      height: 76px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(14, 165, 233, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge-offline {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .btn-retry {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn-retry:hover {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-box">✈️</div>
    <div class="badge-offline">⚡ Offline Mode</div>
    <h1>Internet Disconnected</h1>
    <p>You are currently offline or have weak signal. Installed AREOX continues to serve cached airfare indices, corridor benchmarks, and downloaded observation ledgers.</p>
    <button type="button" class="btn-retry" onclick="window.location.reload()">Check Connection &amp; Reload 🔄</button>
  </div>
</body>
</html>
