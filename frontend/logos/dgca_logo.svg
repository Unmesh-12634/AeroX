<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="dgcaNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- DGCA Shield / Wings Emblem -->
  <g transform="translate(10, 6)">
    <!-- Shield Container -->
    <path d="M 34,8 C 48,8 60,14 62,24 C 62,44 48,58 34,62 C 20,58 6,44 6,24 C 8,14 20,8 34,8 Z" fill="url(#dgcaNavy)" stroke="#D4AF37" stroke-width="1.8"/>
    <!-- Central Golden Wings & Globe -->
    <circle cx="34" cy="30" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Wings spreading left & right -->
    <path d="M 24,28 C 16,24 10,26 8,30 C 14,34 20,32 25,32 Z" fill="#E5C158"/>
    <path d="M 44,28 C 52,24 58,26 60,30 C 54,34 48,32 43,32 Z" fill="#E5C158"/>
    <!-- DGCA Letters inside shield -->
    <text x="34" y="52" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', Inter, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">DGCA</text>
  </g>

  <!-- Typography: DGCA Hindi & English -->
  <g transform="translate(85, 20)">
    <text x="0" y="0" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">नागर विमानन महानिदेशालय</text>
    <text x="0" y="16" font-family="-apple-system, 'SF Pro Display', Inter, sans-serif" font-size="10.5" font-weight="800" fill="#0F172A" letter-spacing="0.4">DIRECTORATE GENERAL OF CIVIL AVIATION</text>
    <text x="0" y="30" font-family="-apple-system, 'SF Pro Display', Inter, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.5">Airfare Surveillance &amp; Regulatory Oversight &bull; India</text>
  </g>
</svg>
