<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <!-- Digital India Dynamic Tricolor Ribbon -->
  <g transform="translate(10, 14)">
    <!-- Saffron ribbon -->
    <path d="M 10,12 C 24,4 38,20 52,12 C 48,18 36,28 20,24 Z" fill="#FF9933"/>
    <!-- Blue wheel center -->
    <circle cx="28" cy="24" r="7" fill="#003366"/>
    <circle cx="28" cy="24" r="2" fill="#FFFFFF"/>
    <!-- Green ribbon -->
    <path d="M 12,32 C 24,24 38,40 52,32 C 44,40 30,44 18,38 Z" fill="#138808"/>
  </g>

  <!-- Typography: Digital India & Power to Empower -->
  <g transform="translate(75, 28)">
    <text x="0" y="0" font-family="-apple-system, 'SF Pro Display', Inter, sans-serif" font-size="18" font-weight="900" fill="#003366" letter-spacing="-0.02em">Digital India</text>
    <text x="0" y="16" font-family="-apple-system, 'SF Pro Display', Inter, sans-serif" font-size="9" font-weight="700" fill="#E65100" letter-spacing="1">POWER TO EMPOWER</text>
    <text x="0" y="28" font-family="-apple-system, 'SF Pro Display', Inter, sans-serif" font-size="8" font-weight="600" fill="#64748B">National Informatics Centre (NIC) Hosted</text>
  </g>
</svg>
