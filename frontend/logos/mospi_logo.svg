<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="mospiBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#002D62"/>
    </linearGradient>
    <linearGradient id="mospiAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>

  <!-- Circular Statistical Bell Curve / Data Icon -->
  <g transform="translate(10, 6)">
    <circle cx="34" cy="34" r="32" fill="url(#mospiBlue)"/>
    <circle cx="34" cy="34" r="30" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Gaussian / CPI Curve -->
    <path d="M 12,46 C 20,46 25,18 34,18 C 43,18 48,46 56,46" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <!-- Bar chart sticks -->
    <rect x="20" y="38" width="4" height="12" rx="1" fill="#FFFFFF" fill-opacity="0.8"/>
    <rect x="27" y="28" width="4" height="22" rx="1" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="34" y="20" width="4" height="30" rx="1" fill="#FF9933"/>
    <rect x="41" y="30" width="4" height="20" rx="1" fill="#138808"/>
    <rect x="48" y="40" width="4" height="10" rx="1" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <!-- Typography: MoSPI Hindi & English -->
  <g transform="translate(85, 20)">
    <text x="0" y="0" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="13" font-weight="700" fill="#0F284E">सांख्यिकी और कार्यक्रम कार्यान्वयन मंत्रालय</text>
    <text x="0" y="16" font-family="-apple-system, 'SF Pro Display', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#003366" letter-spacing="0.2">MINISTRY OF STATISTICS &amp; PROGRAMME IMPLEMENTATION</text>
    <text x="0" y="30" font-family="-apple-system, 'SF Pro Display', Inter, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.5">National Statistical Office (NSO) &bull; Govt. of India</text>
  </g>
</svg>
